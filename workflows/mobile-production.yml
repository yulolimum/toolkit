# Mobile Production Workflow
#
# Manually builds and submits iOS and Android store releases through EAS.
#
# Required secrets:
#   - EXPO_TOKEN: Expo access token for EAS CLI
#
# Replace:
#   - @placeholder/mobile: Your mobile workspace package name
#   - apps/mobile: Your mobile app directory, if different
#
# Before use:
#   - Configure the EAS submit profiles with Apple and Google store details

name: Mobile Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.tool-versions'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile dependencies
        run: pnpm --filter "@placeholder/mobile^..." build

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Generate ${{ matrix.platform }} fingerprint
        working-directory: apps/mobile
        env:
          EAS_BUILD_PROFILE: production
        run: pnpm dlx @expo/fingerprint fingerprint:generate --platform ${{ matrix.platform }}

      - name: Build and submit ${{ matrix.platform }} production
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@latest build --profile production --platform ${{ matrix.platform }} --auto-submit --non-interactive --wait
