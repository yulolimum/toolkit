# Mobile CI Workflow
#
# Runs the mobile test suite for each non-draft pull request.
#
# Replace:
#   - @placeholder/mobile: Your mobile workspace package name

name: Mobile CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.tool-versions'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile tests
        run: pnpm --filter "@placeholder/mobile" test
